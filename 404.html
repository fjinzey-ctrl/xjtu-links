<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>页面未找到 | 西交常用网站汇总</title>
  <link rel="icon" href="/assets/xjtu-links-icon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: #201d1a;
      background: #f4efea;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4efea;
    }

    main {
      width: min(560px, 100%);
      padding: 36px;
      border: 1px solid #dfd4c9;
      border-left: 5px solid #b92d25;
      border-radius: 8px;
      background: #fffdfb;
      box-shadow: 0 14px 36px rgba(55, 42, 31, 0.08);
    }

    .code {
      margin: 0 0 10px;
      color: #b92d25;
      font-size: 1rem;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 8vw, 2.5rem);
      line-height: 1.2;
      letter-spacing: 0;
    }

    p {
      margin: 18px 0 28px;
      color: #6e6259;
      line-height: 1.8;
    }

    a {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border-radius: 6px;
      color: #fff;
      background: #2b2824;
      font-weight: 700;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 3px solid rgba(185, 45, 37, 0.28);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>没有找到这个页面</h1>
    <p>链接可能已经变更，或输入的网址有误。你可以返回网站首页继续查找需要的入口。</p>
    <a href="/">返回首页</a>
  </main>
</body>
</html>
